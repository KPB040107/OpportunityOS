<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save to OpportunityOS</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --foreground: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #ffffff;
      --card-bg: #f8fafc;
      --success: #16a34a;
      --error: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 380px;
      padding: 16px;
      background-color: var(--bg);
      color: var(--foreground);
      font-size: 13px;
      line-height: 1.4;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand img {
      width: 22px;
      height: 22px;
      border-radius: 4px;
    }

    .brand h1 {
      font-size: 14px;
      font-weight: 700;
      color: var(--foreground);
      letter-spacing: -0.2px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      background: var(--card-bg);
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94a3b8;
    }

    .status-dot.online {
      background: #22c55e;
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.4);
    }

    .status-dot.offline {
      background: #ef4444;
    }

    /* Main Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .portal-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--primary-light);
      color: var(--primary);
      margin-bottom: 10px;
    }

    .form-group {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input, textarea {
      width: 100%;
      padding: 7px 10px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #ffffff;
      color: var(--foreground);
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    .snippet-box {
      margin-top: 8px;
      padding: 8px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 11px;
      color: #334155;
      max-height: 70px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    /* Actions */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 9px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--foreground);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #f1f5f9;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Alerts */
    .alert {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 10px;
      display: none;
    }

    .alert.success {
      display: block;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
    }

    .alert.error {
      display: block;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
    }

    .alert-actions {
      margin-top: 8px;
      display: flex;
      gap: 8px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon32.png" alt="Logo">
      <h1>OpportunityOS</h1>
    </div>
    <div class="status-badge" id="appStatus">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Checking...</span>
    </div>
  </div>

  <div class="card" id="previewCard">
    <span class="portal-tag" id="portalBadge">Detecting...</span>
    
    <div class="form-group">
      <label for="oppTitle">Job / Internship Title</label>
      <input type="text" id="oppTitle" placeholder="Loading page title...">
    </div>

    <div class="form-group">
      <label for="oppOrg">Company / Organization</label>
      <input type="text" id="oppOrg" placeholder="e.g. Google, Meesho">
    </div>

    <label>Captured Description Snippet</label>
    <div class="snippet-box" id="oppSnippet">Extracting page content...</div>

    <div class="meta-row">
      <span id="charCount">0 characters</span>
      <span id="linkCount">0 application links</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btnSave">
      <span id="btnSaveText">Save to OpportunityOS</span>
    </button>
    <button class="btn btn-secondary" id="btnFullReview">
      Open Full Review on Dashboard
    </button>
  </div>

  <div class="alert" id="alertBox">
    <div id="alertMsg"></div>
    <div class="alert-actions" id="alertActions"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
