name: opportunityos
services:
  n8n:
    image: ${N8N_IMAGE:?Run the setup script first}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run the setup script first}
      WEBHOOK_URL: ${WEBHOOK_URL:?Set the webhook URL}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Kolkata}
      TZ: ${GENERIC_TIMEZONE:-Asia/Kolkata}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      NODE_EXTRA_CA_CERTS: /home/node/.n8n/supabase-ca.pem
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Slice 2 source preparation pins public DNS addresses and validates redirects.
      # No filesystem, process or arbitrary external modules are enabled.
      NODE_FUNCTION_ALLOW_BUILTIN: "url,crypto,net,dns,http,https,buffer,zlib"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  n8n_data:
