<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpportunityOS — Opportunities</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F1EC}
a{color:#C23E0C}a:hover{color:#8F2C07}
input::placeholder{color:#8A857C}
input:focus{outline:2px solid #FF5A1F;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F3F1EC; font-family: 'Instrument Sans', system-ui, sans-serif; color: #111111">
<div style="flex: 1 1 240px; max-width: 100%"><dc-import name="Nav" active="opps" hint-size="100%,900px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 36px 40px 64px; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #C23E0C">214 READ THIS WEEK · 9 SHOWN</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 52px); line-height: 1; letter-spacing: -0.03em">Opportunities</h1>
</div>
<a href="Capture.dc.html" style="display: inline-flex; align-items: center; height: 46px; padding: 0 18px; box-sizing: border-box; border: 1.5px solid #111111; border-radius: 12px; background: #FFFFFF; box-shadow: 3px 3px 0 #111111; color: #111111; font-size: 14px; font-weight: 700; text-decoration: none">+ Add a listing</a>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<div role="group" aria-label="Type" style="display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border: 1.5px solid #111111; border-radius: 12px; background: #FFFFFF">
<sc-for list="{{types}}" as="t" hint-placeholder-count="4">
<button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="height: 38px; padding: 0 14px; border: 0; border-radius: 8px; background: {{t.bg}}; color: {{t.c}}; font-family: 'Instrument Sans', sans-serif; font-size: 14px; font-weight: 600">{{t.label}}</button>
</sc-for>
</div>
<div role="group" aria-label="Decision" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{decisions}}" as="d" hint-placeholder-count="3">
<button type="button" aria-pressed="{{d.on}}" onClick="{{d.toggle}}" style="height: 40px; padding: 0 14px; border: 1.5px solid #111111; border-radius: 999px; background: {{d.bg}}; color: #111111; box-shadow: {{d.shadow}}; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.06em">{{d.label}} · {{d.count}}</button>
</sc-for>
</div>
<label for="oo-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search opportunities</label>
<input id="oo-search" type="search" placeholder="Search titles, companies, skills" style="flex: 1 1 220px; height: 46px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #111111; border-radius: 12px; background: #FFFFFF; font-family: 'Instrument Sans', sans-serif; font-size: 15px; color: #111111">
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{items}}" as="o" hint-placeholder-count="6">
<a href="Opportunity-Detail.dc.html" style="display: flex; flex-wrap: wrap; align-items: stretch; gap: 0; border: 1.5px solid #111111; border-radius: 14px; background: {{o.cardBg}}; box-shadow: {{o.shadow}}; color: #111111; text-decoration: none; overflow: hidden; opacity: {{o.op}}">
<div style="flex: 0 0 104px; box-sizing: border-box; padding: 16px; border-right: 1.5px solid #111111; background: {{o.scoreBg}}; display: flex; flex-direction: column; justify-content: center; gap: 2px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -0.03em">{{o.score}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: #3D3A35">{{o.scoreNote}}</span>
</div>
<div style="flex: 1 1 320px; min-width: 0; box-sizing: border-box; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #5F5B54">{{o.kind}}</span>
<span style="padding: 2px 8px; border: 1px solid {{o.trustBorder}}; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.04em; color: {{o.trustC}}; background: {{o.trustBg}}">{{o.trust}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 18px; font-weight: 600">{{o.title}}</span>
<span style="font-size: 14px; color: #3D3A35">{{o.org}}</span>
</div>
<span style="font-size: 14px; color: {{o.reasonC}}">{{o.reason}}</span>
</div>
<div style="flex: 0 1 220px; box-sizing: border-box; padding: 16px 18px; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 10px">
<span style="padding: 4px 10px; border: 1.5px solid #111111; border-radius: 8px; background: {{o.decBg}}; color: {{o.decC}}; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.08em">{{o.decision}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #3D3A35; text-align: right">{{o.deadline}}</span>
</div>
</a>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="padding: 40px; border: 1.5px dashed #111111; border-radius: 14px; text-align: center; font-size: 15px; color: #3D3A35">Nothing matches these filters.</div>
</sc-if>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { type: 'all', act: true, ask: true, skip: false };
  }
  renderVals() {
    var self = this;
    var all = [
      { t: 'internship', kind: 'INTERNSHIP · BENGALURU · HYBRID', title: 'SDE Intern', org: 'Paperkite', score: '92', d: 'act', reason: 'All 4 hard requirements met. Deadline is on your calendar.', deadline: 'Fri 24 Oct\n11:59 PM IST', trust: 'Company feed' },
      { t: 'internship', kind: 'INTERNSHIP · HYDERABAD', title: 'Data Analyst Intern', org: 'Northwind Analytics', score: '91', d: 'act', reason: 'Python and SQL match exactly. Added to your tracker.', deadline: 'Sat 25 Oct\n6:00 PM IST', trust: 'Company feed' },
      { t: 'hackathon', kind: 'HACKATHON · REMOTE · 48 HOURS', title: '48h Fintech Build', org: 'Orbitpay', score: '88', d: 'act', reason: 'Open to all students, no entry fee. Submission on your calendar.', deadline: 'Mon 27 Oct\n6:30 PM IST', trust: 'Devpost' },
      { t: 'job', kind: 'JOB · PUNE · FULL TIME', title: 'Associate Engineer', org: 'Brightline Systems', score: '84', d: 'act', reason: 'Takes 2027 graduates. Reminder set a week before.', deadline: 'Sun 2 Nov\n11:59 PM IST', trust: 'Company feed' },
      { t: 'internship', kind: 'INTERNSHIP · REMOTE', title: 'Product Intern', org: 'Tessellate', score: '74', d: 'ask', reason: 'The listing doesn’t say if 2027 graduates can apply. Waiting for your approval.', deadline: 'Thu 30 Oct\n5:00 PM IST', trust: 'Job board' },
      { t: 'internship', kind: 'INTERNSHIP · HYDERABAD', title: 'ML Intern', org: 'Quill Health', score: null, d: 'ask', reason: 'Requires PyTorch, which isn’t on your profile yet.', deadline: 'Wed 5 Nov\n11:59 PM IST', trust: 'Company feed', missing: '1 FACT MISSING' },
      { t: 'hackathon', kind: 'HACKATHON · GLOBAL · ONLINE', title: 'Global AI Challenge', org: 'Devpost', score: null, d: 'ask', reason: 'Participants must be 18 or older. We don’t know your age yet.', deadline: 'Mon 20 Oct\n11:59 PM IST', trust: 'Devpost', missing: '1 FACT MISSING' },
      { t: 'internship', kind: 'INTERNSHIP · WORK FROM HOME', title: 'Marketing Intern (Unpaid)', org: 'QuickHire Careers', score: null, d: 'skip', reason: 'Asks for a ₹2,000 “kit fee” before joining. Flagged as unsafe.', deadline: 'Rolling', trust: 'Unverified', missing: 'NOT SCORED' },
      { t: 'job', kind: 'JOB · BENGALURU', title: 'Senior Software Engineer', org: 'Fernway', score: '41', d: 'skip', reason: 'Needs 5+ years of experience. You have 3 months.', deadline: 'Fri 31 Oct', trust: 'Job board' }
    ];
    var st = this.state;
    var dec = {
      act: { label: 'ACT', bg: '#FFE3D6', c: '#111111', scoreBg: '#FFE3D6', reasonC: '#111111' },
      ask: { label: 'ASK', bg: '#E1E8FF', c: '#111111', scoreBg: '#E1E8FF', reasonC: '#2445C8' },
      skip: { label: 'SKIP', bg: '#ECEAE5', c: '#3D3A35', scoreBg: '#ECEAE5', reasonC: '#5F5B54' }
    };
    var trustStyle = {
      'Company feed': { c: '#111111', b: '#111111', bg: '#FFFFFF', label: '✓ COMPANY FEED' },
      'Devpost': { c: '#3D3A35', b: '#8A857C', bg: '#FFFFFF', label: 'DEVPOST' },
      'Job board': { c: '#3D3A35', b: '#8A857C', bg: '#FFFFFF', label: 'JOB BOARD' },
      'Unverified': { c: '#9F1D12', b: '#9F1D12', bg: '#FDE4E1', label: '! UNVERIFIED' }
    };
    var typed = all.filter(function (o) { return st.type === 'all' || o.t === st.type; });
    var counts = { act: 0, ask: 0, skip: 0 };
    typed.forEach(function (o) { counts[o.d]++; });
    var items = typed.filter(function (o) { return st[o.d]; }).map(function (o) {
      var s = dec[o.d], tr = trustStyle[o.trust];
      return {
        kind: o.kind, title: o.title, org: o.org, reason: o.reason, deadline: o.deadline.replace('\n', ' · '),
        score: o.score || '—', scoreNote: o.score ? 'MATCH' : o.missing,
        decision: s.label, decBg: s.bg, decC: s.c, scoreBg: s.scoreBg, reasonC: s.reasonC,
        cardBg: '#FFFFFF', shadow: o.d === 'skip' ? 'none' : '4px 4px 0 #111111', op: o.d === 'skip' ? 0.85 : 1,
        trust: tr.label, trustC: tr.c, trustBorder: tr.b, trustBg: tr.bg
      };
    });
    var types = [['all', 'All'], ['internship', 'Internships'], ['job', 'Jobs'], ['hackathon', 'Hackathons']].map(function (t) {
      var on = st.type === t[0];
      return { label: t[1], on: on ? 'true' : 'false', bg: on ? '#111111' : 'transparent', c: on ? '#FFFFFF' : '#3D3A35', pick: function () { self.setState({ type: t[0] }); } };
    });
    var decisions = ['act', 'ask', 'skip'].map(function (k) {
      var on = !!st[k];
      return { label: dec[k].label, count: counts[k], on: on ? 'true' : 'false', bg: on ? dec[k].bg : '#FFFFFF', shadow: on ? '2px 2px 0 #111111' : 'none', toggle: function () { var u = {}; u[k] = !self.state[k]; self.setState(u); } };
    });
    return { items: items, types: types, decisions: decisions, empty: items.length === 0 };
  }
}
</script>
</body>
</html>
