<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpportunityOS — Sources and feeds</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F1EC}
a{color:#C23E0C}a:hover{color:#8F2C07}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F3F1EC; font-family: 'Instrument Sans', system-ui, sans-serif; color: #111111">
<div style="flex: 1 1 240px; max-width: 100%"><dc-import name="Nav" active="sources" hint-size="100%,900px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 36px 40px 64px; display: flex; flex-direction: column; gap: 24px; max-width: 1080px">

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #C23E0C">{{activeCount}} ACTIVE · LAST SCAN 12 MIN AGO</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(34px, 4vw, 52px); line-height: 1; letter-spacing: -0.03em">Sources &amp; feeds</h1>
<p style="margin: 0; font-size: 16px; color: #3D3A35">Where it looks. The badge says how much each source is trusted.</p>
</div>
<button type="button" style="height: 46px; padding: 0 18px; border: 1.5px solid #111111; border-radius: 12px; background: #FF5A1F; box-shadow: 3px 3px 0 #111111; font-family: 'Instrument Sans', sans-serif; font-size: 14px; font-weight: 700; color: #111111">+ Watch a company</button>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{legend}}" as="l" hint-placeholder-count="3">
<div style="flex: 1 1 220px; padding: 12px 14px; border: 1.5px solid #111111; border-radius: 12px; background: {{l.bg}}; display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: {{l.c}}">{{l.name}}</span>
<span style="font-size: 13px; color: #3D3A35">{{l.text}}</span>
</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{sources}}" as="s" hint-placeholder-count="6">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 18px 20px; border: 1.5px solid #111111; border-radius: 14px; background: {{s.bg}}; box-shadow: {{s.shadow}}">
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="font-size: 17px; font-weight: 600">{{s.name}}</span>
<span style="padding: 2px 8px; border: 1px solid {{s.tc}}; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: {{s.tc}}">{{s.trust}}</span>
</div>
<span style="font-size: 14px; color: #3D3A35">{{s.desc}}</span>
</div>
<div style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 120px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1">{{s.found}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #5F5B54">{{s.foundLabel}}</span>
</div>
<button type="button" role="switch" aria-checked="{{s.on}}" aria-label="{{s.name}}" onClick="{{s.toggle}}" style="flex: 0 0 60px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center">
<span style="width: 60px; height: 32px; box-sizing: border-box; border: 1.5px solid #111111; border-radius: 999px; padding: 3px; background: {{s.track}}; display: flex; justify-content: {{s.align}}">
<span style="width: 23px; height: 23px; box-sizing: border-box; border: 1.5px solid #111111; border-radius: 50%; background: #FFFFFF"></span>
</span>
</button>
</div>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1050}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { lever: true, gh: true, ashby: true, jsearch: true, devpost: true, email: true } };
  }
  renderVals() {
    var self = this;
    var trust = {
      c: { label: '✓ COMPANY DIRECT', c: '#111111' },
      a: { label: 'ATTRIBUTED', c: '#3D3A35' }
    };
    var defs = [
      { id: 'lever', name: 'Lever career pages', t: 'c', desc: '8 companies, including Paperkite and Brightline.', found: '46' },
      { id: 'gh', name: 'Greenhouse career pages', t: 'c', desc: '5 companies, including Northwind Analytics.', found: '31' },
      { id: 'ashby', name: 'Ashby career pages', t: 'c', desc: '3 companies, including Tessellate.', found: '12' },
      { id: 'jsearch', name: 'Job boards (LinkedIn, Indeed, Glassdoor)', t: 'a', desc: 'Searched for your skills in Bengaluru, Hyderabad and remote.', found: '98' },
      { id: 'devpost', name: 'Devpost hackathons', t: 'a', desc: 'Open online hackathons and ones in India.', found: '19' },
      { id: 'email', name: 'Forwarded emails', t: 'a', desc: 'Anything you forward to ananya.x7k@in.opportunityos.app', found: '8' }
    ];
    var sources = defs.map(function (d) {
      var on = !!self.state.on[d.id];
      return {
        name: d.name, desc: d.desc, trust: trust[d.t].label, tc: trust[d.t].c,
        found: on ? d.found : '—', foundLabel: on ? 'FOUND THIS WEEK' : 'PAUSED',
        on: on ? 'true' : 'false', bg: on ? '#FFFFFF' : '#F3F1EC', shadow: on ? '4px 4px 0 #111111' : 'none',
        track: on ? '#FF5A1F' : '#DAD6CE', align: on ? 'flex-end' : 'flex-start',
        toggle: function () { var x = Object.assign({}, self.state.on); x[d.id] = !x[d.id]; self.setState({ on: x }); }
      };
    });
    return {
      sources: sources,
      activeCount: sources.filter(function (s) { return s.on === 'true'; }).length,
      legend: [
        { name: '✓ COMPANY DIRECT', c: '#111111', bg: '#FFFFFF', text: 'Straight from the company’s own careers page. Trusted most.' },
        { name: 'ATTRIBUTED', c: '#3D3A35', bg: '#FFFFFF', text: 'From a board or portal that names its source. Double-checked.' },
        { name: '! UNVERIFIED', c: '#9F1D12', bg: '#FDE4E1', text: 'Asks for money or looks off. Never acted on, always flagged.' }
      ]
    };
  }
}
</script>
</body>
</html>
