<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; box-sizing: border-box; padding: 20px 14px; border-right: 1.5px solid #111111; background: #F3F1EC; display: flex; flex-direction: column; gap: 22px; font-family: 'Instrument Sans', system-ui, sans-serif; color: #111111">
<a href="Home.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 0 8px; color: #111111; text-decoration: none">
<span aria-hidden="true" style="width: 20px; height: 20px; border: 1.5px solid #111111; border-radius: 5px; background: #FF5A1F; box-shadow: 2px 2px 0 #111111"></span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em">OpportunityOS</span>
</a>

<nav aria-label="Main" style="display: flex; flex-direction: column; gap: 4px">
<span style="padding: 0 10px 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #5F5B54">WORKSPACE</span>
<sc-for list="{{main}}" as="i" hint-placeholder-count="5">
<a href="{{i.href}}" aria-current="{{i.current}}" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 42px; padding: 0 10px; box-sizing: border-box; border: 1.5px solid {{i.border}}; border-radius: 10px; background: {{i.bg}}; color: {{i.color}}; text-decoration: none; font-size: 15px; font-weight: 600">
<span>{{i.name}}</span>
<sc-if value="{{i.hasCount}}" hint-placeholder-val="{{false}}">
<span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border: 1.5px solid #111111; border-radius: 999px; background: #FF5A1F; color: #111111; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center">{{i.count}}</span>
</sc-if>
</a>
</sc-for>
</nav>

<nav aria-label="Settings" style="display: flex; flex-direction: column; gap: 4px">
<span style="padding: 0 10px 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #5F5B54">SETUP</span>
<sc-for list="{{setup}}" as="i" hint-placeholder-count="5">
<a href="{{i.href}}" aria-current="{{i.current}}" style="display: flex; align-items: center; min-height: 40px; padding: 0 10px; box-sizing: border-box; border: 1.5px solid {{i.border}}; border-radius: 10px; background: {{i.bg}}; color: {{i.color}}; text-decoration: none; font-size: 14px; font-weight: 500">{{i.name}}</a>
</sc-for>
</nav>

<div style="margin-top: auto; padding: 12px; border: 1.5px solid #111111; border-radius: 12px; background: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; font-weight: 600">Ananya Rao</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5F5B54">BALANCED MODE · B.TECH '27</span>
<a href="Main.dc.html" style="margin-top: 4px; display: inline-flex; align-items: center; min-height: 32px; font-size: 13px; color: #3D3A35">Sign out</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","opps","apps","approvals","profile","sources","rules","activity","capture"],"default":"home"},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active || 'home';
    var style = function (it) {
      var on = it.id === active;
      it.current = on ? 'page' : 'false';
      it.bg = on ? '#111111' : 'transparent';
      it.color = on ? '#FFFFFF' : '#3D3A35';
      it.border = on ? '#111111' : 'transparent';
      it.hasCount = !!it.count;
      if (!it.count) it.count = '';
      return it;
    };
    return {
      main: [
        { id: 'home', name: 'Home', href: 'Home.dc.html' },
        { id: 'opps', name: 'Opportunities', href: 'Opportunities.dc.html', count: '9' },
        { id: 'approvals', name: 'Approvals', href: 'Approvals.dc.html', count: '4' },
        { id: 'apps', name: 'Applications', href: 'Applications.dc.html' },
        { id: 'activity', name: 'Activity', href: 'Activity.dc.html' }
      ].map(style),
      setup: [
        { id: 'profile', name: 'Profile & resume', href: 'Profile.dc.html' },
        { id: 'rules', name: 'Automation rules', href: 'Rules.dc.html' },
        { id: 'sources', name: 'Sources & feeds', href: 'Sources.dc.html' },
        { id: 'capture', name: 'Capture tools', href: 'Capture.dc.html' }
      ].map(style)
    };
  }
}
</script>
</body>
</html>
